<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архив статей | The Edinorog</title>
    <meta name="description"
        content="Полный список всех статей блога The Edinorog. Читайте лучшие материалы о бизнесе и маркетинге.">

    <link rel="icon" href="img/1.jpg" type="image/jpeg">

    <!-- Styles -->
    <link rel="stylesheet" href="css/index.css">
    <!-- Local Assets -->
    <script src="js/tailwindcss.js"></script>
    <script src="js/lucide.js"></script>
    <link rel="stylesheet" href="css/themes.css">

    <style>
        /* Font & Colors Handled by themes.css */
    </style>
</head>

<body class="min-h-screen flex flex-col relative selection:bg-purple-500/30 transition-colors duration-500">

    <!-- BACKGROUND FX (Фоновые эффекты) -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden block">
        <div
            class="absolute top-[-20%] left-[20%] w-[60vw] h-[60vw] bg-purple-900/20 blur-[120px] rounded-full mix-blend-screen animate-pulse duration-[10s]">
        </div>
        <div
            class="absolute bottom-[-10%] right-[-10%] w-[40vw] h-[40vw] bg-blue-900/10 blur-[100px] rounded-full mix-blend-screen">
        </div>
        <div
            class="absolute top-[40%] left-[-10%] w-[30vw] h-[30vw] bg-pink-900/10 blur-[80px] rounded-full mix-blend-screen">
        </div>
        <!-- Grain Overlay (Шум) -->
        <div class="absolute inset-0 bg-[url('img/noise.svg')] opacity-20 brightness-100 contrast-150"></div>
    </div>

    <!-- Navigation -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-[#050505]/80 backdrop-blur-md border-b border-white/5">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3 group">
                <div class="relative">
                    <div
                        class="absolute inset-0 bg-purple-500 blur-lg opacity-50 group-hover:opacity-100 transition-opacity">
                    </div>
                    <div
                        class="relative p-0 bg-gradient-to-tr from-gray-900 to-black border border-white/10 rounded-xl group-hover:scale-105 transition-transform overflow-hidden">
                        <img src="img/1.jpg" alt="Logo" class="w-10 h-10 object-cover">
                    </div>
                </div>
                <div class="flex flex-col text-left">
                    <span class="font-bold text-xl tracking-tight leading-none text-white">The Edinorog</span>
                    <span class="text-[10px] uppercase tracking-[0.3em] text-white/40 font-semibold mt-1">Зеркало
                        Блога</span>
                </div>
            </a>
            <a href="index.html" class="text-sm font-bold text-white/60 hover:text-white transition-colors">
                ← На главную
            </a>
        </div>
    </nav>

    <!-- Header -->
    <header class="pt-32 pb-12 px-6 text-center">
        <h1 class="text-4xl md:text-5xl font-bold mb-4">Архив материалов</h1>
        <p class="text-white/50 max-w-xl mx-auto">Полная коллекция всех постов из Telegram-канала. Используйте этот
            список для быстрого поиска.</p>
    </header>

    <!-- Archive Container -->
    <main class="flex-grow px-6 pb-20">
        <div id="archive-container" class="max-w-3xl mx-auto">
            <!-- JS will inject list here -->
            <div class="text-center py-12 text-white/30 animate-pulse">Загрузка архива...</div>
        </div>
    </main>

    <footer class="border-t border-white/5 bg-black py-12 text-center relative z-10">
        <p class="text-white/30 text-sm mb-4">
            &copy; 2026 The Edinorog Mirror. Content from Telegram.
        </p>
        <div class="flex items-center justify-center gap-4">
            <button onclick="forceUpdateFeed(this)" title="Обновить статьи"
                class="text-white/10 hover:text-white/50 transition-colors p-2 rounded-full">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
            </button>
            <a href="https://t.me/Theedinorogblog" target="_blank"
                class="inline-flex items-center gap-2 px-4 py-2 bg-white/5 hover:bg-white/10 border border-white/5 rounded-full text-purple-400 hover:text-purple-300 transition-all text-sm font-medium group">
                <i data-lucide="send"
                    class="w-4 h-4 group-hover:-translate-y-0.5 group-hover:translate-x-0.5 transition-transform"></i>
                <span>The Edinorog Blog</span>
            </a>
        </div>
    </footer>

    <!-- Loader Script -->
    <script src="js/telegram-loader.js"></script>
</body>

</html>
