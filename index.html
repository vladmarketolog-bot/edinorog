<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Edinorog Mirror — Инсайды, Венчур, Будущее</title>
    <meta name="description"
        content="Ежедневный дайджест для инвесторов и фаундеров. Зеркало Telegram-канала The Edinorog. Венчур, AI, стартапы и технологии будущего.">
    <meta name="keywords" content="венчур, стартапы, AI, инвестиции, технологии, The Edinorog, Telegram зеркало">
    <link rel="canonical" href="https://theedinorog.com/">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://theedinorog.com/">
    <meta property="og:title" content="The Edinorog Mirror — Инсайды Будущего">
    <meta property="og:description"
        content="Мы отслеживаем сигналы будущего в шуме настоящего. Читайте лучшие инсайды из Telegram без VPN.">
    <meta property="og:image" content="https://theedinorog.com/img/og-image.jpg">

    <!-- Twitter -->


    <link rel="icon" href="img/1.jpg" type="image/jpeg">

    <!-- Подключаем Tailwind CSS -->
    <!-- Подключаем Tailwind CSS (Local) -->
    <script src="js/tailwindcss.js"></script>


    <!-- Подключаем иконки Lucide (Local) -->
    <script src="js/lucide.js"></script>

    <!-- Настройка шрифтов (Inter) -->
    <!-- Font Stack managed by themes.css -->
    <link rel="stylesheet" href="css/themes.css">

    <style>
        /* body settings handled by themes.css */

        /* Скрытие скроллбара для горизонтальных списков */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Кастомное выделение текста */
        ::selection {
            background-color: rgba(168, 85, 247, 0.3);
            color: #e9d5ff;
        }
    </style>
</head>

<body class="overflow-x-hidden relative selection:bg-purple-500/30 transition-colors duration-500">

    <!-- BACKGROUND FX (Фоновые эффекты) -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
        <div
            class="absolute top-[-20%] left-[20%] w-[60vw] h-[60vw] bg-purple-900/20 blur-[120px] rounded-full mix-blend-screen animate-pulse duration-[10s]">
        </div>
        <div
            class="absolute bottom-[-10%] right-[-10%] w-[40vw] h-[40vw] bg-blue-900/10 blur-[100px] rounded-full mix-blend-screen">
        </div>
        <div
            class="absolute top-[40%] left-[-10%] w-[30vw] h-[30vw] bg-pink-900/10 blur-[80px] rounded-full mix-blend-screen">
        </div>
        <!-- Grain Overlay (Шум) -->
        <div class="absolute inset-0 bg-[url('img/noise.svg')] opacity-20 brightness-100 contrast-150"></div>
    </div>

    <!-- NAVBAR -->
    <nav id="navbar" class="fixed top-0 w-full z-50 transition-all duration-500 py-6 bg-transparent">
        <div class="max-w-7xl mx-auto px-6 flex items-center justify-between">
            <!-- Logo -->
            <div class="flex items-center gap-3 group cursor-pointer">
                <div class="relative">
                    <div
                        class="absolute inset-0 bg-purple-500 blur-lg opacity-50 group-hover:opacity-100 transition-opacity">
                    </div>
                    <div
                        class="relative p-0 bg-gradient-to-tr from-gray-900 to-black border border-white/10 rounded-xl group-hover:scale-105 transition-transform overflow-hidden">
                        <img src="img/1.jpg" alt="Logo" class="w-10 h-10 object-cover">
                    </div>
                </div>
                <div class="flex flex-col">
                    <span class="font-bold text-xl tracking-tight leading-none">The Edinorog</span>
                    <span class="text-[10px] uppercase tracking-[0.3em] text-white/40 font-semibold mt-1">Зеркало
                        Блога</span>
                </div>
            </div>

            <!-- Desktop Search -->
            <div class="hidden lg:flex items-center bg-white/5 border border-white/5 rounded-full p-1 pl-6">
                <input type="text" id="search-input" placeholder="Поиск по инсайдам..."
                    class="bg-transparent border-none focus:outline-none text-sm w-64 placeholder:text-white/20 text-white">
                <button id="search-btn" class="p-2 bg-white/10 hover:bg-white/20 rounded-full transition-colors ml-2">
                    <i data-lucide="search" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-4">
                <a href="https://t.me/Theedinorogblog" target="_blank"
                    class="hidden md:flex items-center gap-2 px-5 py-2.5 bg-[var(--text-main)] text-[var(--bg-main)] rounded-full text-xs font-bold uppercase tracking-wider hover:opacity-90 transition-all shadow-lg">
                    <i data-lucide="zap" class="w-3.5 h-3.5 fill-current"></i> Подписаться
                </a>
                <button onclick="toggleTheme()" id="theme-toggle-btn"
                    class="p-3 hover:bg-white/10 rounded-full transition-colors theme-text-main" title="Сменить тему">
                    <i data-lucide="moon" class="w-5 h-5"></i>
                </button>

            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="relative z-10 pt-32 pb-20 px-6 max-w-7xl mx-auto">

        <!-- FEATURED HERO SECTION (Dynamic) -->
        <div id="hero-container" class="mb-16">
            <!-- Loaded by JS -->
            <div class="animate-pulse w-full aspect-[21/9] bg-white/5 rounded-[2rem]"></div>
        </div>

        <div class="w-full">
            <div id="posts-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Posts will be loaded here by telegram-loader.js -->
            </div>

            <!-- Load More Button -->
            <div class="mt-20 flex justify-center">
                <button id="load-more-btn" onclick="loadMore()"
                    class="px-10 py-4 rounded-full border border-white/10 hover:bg-white/5 text-sm font-bold uppercase tracking-widest transition-all hover:scale-105 active:scale-95 flex items-center gap-2 text-white">
                    <i data-lucide="sparkles" class="w-4 h-4"></i> Показать ещё <span class="remaining-count"></span>
                </button>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-white/5 bg-black py-12 text-center relative z-10">
        <p class="text-white/30 text-sm mb-4">
            &copy; 2026 The Edinorog Mirror. Content from Telegram.
        </p>
        <div class="flex items-center justify-center gap-4">
            <button onclick="forceUpdateFeed(this)" title="Обновить статьи"
                class="text-white/10 hover:text-white/50 transition-colors p-2 rounded-full">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
            </button>
            <a href="https://t.me/Theedinorogblog" target="_blank"
                class="inline-flex items-center gap-2 px-4 py-2 bg-white/5 hover:bg-white/10 border border-white/5 rounded-full text-purple-400 hover:text-purple-300 transition-all text-sm font-medium group">
                <i data-lucide="send"
                    class="w-4 h-4 group-hover:-translate-y-0.5 group-hover:translate-x-0.5 transition-transform"></i>
                <span>The Edinorog Blog</span>
            </a>
        </div>
    </footer>

    <!-- Custom Scripts -->
    <script src="js/telegram-loader.js"></script>

    <!-- Scripts -->
    <script>
        // Инициализация иконок
        lucide.createIcons();

        // Эффект скролла для навбара
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('theme-bg-header', 'backdrop-blur-xl', 'border-b', 'theme-border', 'py-4');
                navbar.classList.remove('py-6', 'bg-transparent');
            } else {
                navbar.classList.remove('theme-bg-header', 'backdrop-blur-xl', 'border-b', 'theme-border', 'py-4');
                navbar.classList.add('py-6', 'bg-transparent');
            }
        });
    </script>
    <script src="https://vladmarketolog.ru/vlad-badge.js" async></script>
</body>

</html>
